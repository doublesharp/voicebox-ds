name: Voicebox DS builds
run-name: Voicebox DS ${{ inputs.release_tag || inputs.platforms || github.ref_name }}

on:
  push:
    tags:
      - 'ds-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing ds-v tag to build and publish on all platforms
        type: string
        required: false
      platforms:
        description: Platforms to package when no release tag is specified
        type: choice
        required: true
        default: both
        options:
          - both
          - macos
          - windows
          - linux

permissions:
  contents: read

concurrency:
  group: voicebox-ds-build-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_tag }}

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/doublesharp'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}{1}{2}]',
          (inputs.platforms == 'macos' || inputs.platforms == 'both' || github.event_name == 'push' || inputs.release_tag) && '{"os":"macos-26","target":"aarch64-apple-darwin","python_arch":"arm64","artifact":"macos-arm64","bundles":"app"}' || '',
          (inputs.platforms == 'both' || github.event_name == 'push' || inputs.release_tag) && ',{"os":"windows-latest","target":"x86_64-pc-windows-msvc","python_arch":"x64","artifact":"windows-x64","bundles":"nsis"}' || inputs.platforms == 'windows' && '{"os":"windows-latest","target":"x86_64-pc-windows-msvc","python_arch":"x64","artifact":"windows-x64","bundles":"nsis"}' || '',
          (github.event_name == 'push' || inputs.release_tag) && ',{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","python_arch":"x64","artifact":"linux-x64","bundles":"deb"}' || inputs.platforms == 'linux' && '{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","python_arch":"x64","artifact":"linux-x64","bundles":"deb"}' || '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      CUDA_TORCH_VERSION: "2.11.0+cu128"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Fingerprint backend inputs
        id: source
        run: |
          echo "backend=${{ hashFiles('backend/*.py', 'backend/backends/**', 'backend/services/**', 'backend/routes/**', 'backend/utils/**', 'backend/database/**', 'backend/vendor/**', 'backend/mcp_server/**', 'backend/mcp_shim/**', 'backend/studio/**', 'backend/pyi_hooks/**', 'backend/requirements*.txt') }}" >> "$GITHUB_OUTPUT"

      - name: Reuse unchanged CPU and MCP binaries
        id: server-cache
        uses: actions/cache@v4
        with:
          path: tauri/src-tauri/binaries
          key: fork-sidecars-v2-${{ matrix.target }}-py312-${{ steps.source.outputs.backend }}

      - name: Reuse unchanged CUDA backend
        if: runner.os == 'Windows'
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: backend/dist/voicebox-server-cuda
          key: fork-cuda-v2-${{ env.CUDA_TORCH_VERSION }}-${{ matrix.target }}-py312-${{ steps.source.outputs.backend }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          # Avoid restoring a multi-GB wheel cache when all binaries were reused.
          cache: ${{ (steps.server-cache.outputs.cache-hit != 'true' || (runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true')) && 'pip' || '' }}
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-mlx.txt

      - name: Verify tag version
        if: github.event_name == 'push' || inputs.release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path("tauri/src-tauri/tauri.conf.json").read_text())["version"]
          if os.environ["RELEASE_TAG"] != f"ds-v{version}":
              raise SystemExit(f"Expected tag ds-v{version} for the tagged app version")
          PY

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libssl-dev libxdo-dev libudev-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
          shared-key: fork-${{ matrix.target }}

      - name: Configure Cargo Steward wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: Track Cargo build cache (tauri/src-tauri)
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: start
          working-directory: tauri/src-tauri
          target-dir: ${{ github.workspace }}/tauri/src-tauri/target
      - name: Install backend dependencies when a binary needs rebuilding
        if: steps.server-cache.outputs.cache-hit != 'true' || (runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true')
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install pyinstaller -r backend/requirements.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -c 'import torch; assert torch.version.cuda is None, "Linux packages require CPU PyTorch"'
          fi
          python -m pip install --no-deps chatterbox-tts hume-tada omnivoice
          python -m pip install --no-deps "moss-tts-nano @ git+https://github.com/OpenMOSS/MOSS-TTS-Nano.git@8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb"
          python -m pip install --no-deps faster-qwen3-tts==0.3.2
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -m pip install -r backend/requirements-mlx.txt
            python -m pip install --no-deps mlx-lm==0.31.1 mlx-audio==0.4.1
          fi

      - name: Build CPU and MCP binaries
        if: steps.server-cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python backend/build_binary.py
          python backend/build_binary.py --shim
          mkdir -p tauri/src-tauri/binaries
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          for name in voicebox-server voicebox-mcp; do
            packaged="voicebox-ds-${name#voicebox-}"
            if [ "$RUNNER_OS" = "macOS" ] && [ "$name" = "voicebox-server" ]; then
              cp -R "backend/dist/${name}" "tauri/src-tauri/binaries/${name}"
              if [ -d "tauri/src-tauri/binaries/${name}/_internal/Python.framework" ]; then
                codesign --force --deep --sign - --timestamp=none "tauri/src-tauri/binaries/${name}/_internal/Python.framework"
              fi
              cp "backend/dist/${name}/${name}" "tauri/src-tauri/binaries/${packaged}-${TARGET}"
            else
              cp "backend/dist/${name}${suffix}" "tauri/src-tauri/binaries/${packaged}-${TARGET}${suffix}"
            fi
          done

      - name: Build CUDA backend
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true'
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX"
        run: |
          python -m pip install --force-reinstall --no-deps \
            "torch==$CUDA_TORCH_VERSION" torchvision==0.26.0+cu128 torchaudio==2.11.0+cu128 \
            --index-url https://download.pytorch.org/whl/cu128
          python -c "import torch; assert torch.version.cuda, 'CUDA PyTorch is required'; print(torch.__version__, torch.version.cuda)"
          python backend/build_binary.py --cuda

      - name: Install frontend dependencies and check types
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Configure a custom build without upstream updates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = {
              "bundle": {"createUpdaterArtifacts": False},
              "plugins": {"updater": {"endpoints": []}},
          }
          if os.environ["RUNNER_OS"] == "macOS":
              config["bundle"]["macOS"] = {"signingIdentity": "-"}
          Path("tauri/fork-build.json").write_text(json.dumps(config))
          PY

      - name: Build desktop bundle
        working-directory: tauri
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          bun run tauri build --ci --target "$TARGET" --bundles "$BUNDLES" --config fork-build.json

      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets/macos-arm64
          APP_BUNDLE=$(find "tauri/src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" release-assets/macos-arm64/Voicebox-DS-macOS-arm64.zip

      - name: Collect Linux package
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets/linux-x64
          cp tauri/src-tauri/target/"$TARGET"/release/bundle/deb/*.deb release-assets/linux-x64/Voicebox-DS-Linux-x64.deb

      - name: Package Windows installer and optional CUDA downloads
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets/{windows-x64,windows-cuda,windows-cuda-libs}
          cp tauri/src-tauri/target/"$TARGET"/release/bundle/nsis/*-setup.exe release-assets/windows-x64/Voicebox-DS-Windows-x64-setup.exe
          python scripts/package_cuda.py backend/dist/voicebox-server-cuda \
            --platform windows-x86_64 --output release-assets/windows-cuda \
            --torch-compat "==$CUDA_TORCH_VERSION" --split-runtime
          mv release-assets/windows-cuda/cuda-libs-*.tar.gz* release-assets/windows-cuda-libs/
          cp scripts/install-cuda-backend.ps1 release-assets/windows-cuda/Install-CUDA.ps1

      - name: Record source revision and file checksums
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          for folder in Path("release-assets").iterdir():
              files = {}
              for path in sorted(folder.iterdir()):
                  with path.open("rb") as stream:
                      files[path.name] = hashlib.file_digest(stream, "sha256").hexdigest()
              manifest = {"commit": commit, "target": os.environ["BUILD_TARGET"], "files": files}
              (folder / "build-info.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Voicebox-DS-${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: ${{ (github.event_name == 'push' || inputs.release_tag) && 1 || 7 }}
          compression-level: 0

      - name: Upload optional CUDA backend
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Voicebox-DS-windows-cuda
          path: release-assets/windows-cuda/
          if-no-files-found: error
          retention-days: ${{ (github.event_name == 'push' || inputs.release_tag) && 1 || 7 }}
          compression-level: 0

      - name: Upload optional NVIDIA runtime libraries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Voicebox-DS-windows-cuda-libs
          path: release-assets/windows-cuda-libs/
          if-no-files-found: error
          retention-days: ${{ (github.event_name == 'push' || inputs.release_tag) && 1 || 7 }}
          compression-level: 0
      - name: Trim Cargo build cache (tauri/src-tauri)
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: trim
          working-directory: tauri/src-tauri
          target-dir: ${{ github.workspace }}/tauri/src-tauri/target
          budget: 4GiB

  publish:
    if: github.event_name == 'push' || inputs.release_tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Voicebox-DS-*
          path: artifacts
      - name: Publish packages on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir assets
          find artifacts -mindepth 2 -type f ! -name build-info.json -exec mv -n {} assets/ \;
          cd assets
          test -s Voicebox-DS-macOS-arm64.zip
          test -s Voicebox-DS-Linux-x64.deb
          test -s Voicebox-DS-Windows-x64-setup.exe
          test -s voicebox-server-cuda-windows-x86_64.tar.gz
          test -s Install-CUDA.ps1
          test -s cuda-libs.json
          compgen -G 'cuda-libs-windows-x86_64-*.tar.gz*' >/dev/null
          oversized=$(find . -type f -size +2147483647c)
          if [ -n "$oversized" ]; then
            printf 'Release assets must be smaller than 2 GiB:\n%s\n' "$oversized" >&2
            exit 1
          fi
          sha256sum ./* > SHA256SUMS.txt
          if status=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [ "$status" = 'true' ]; then
              gh release upload "$TAG" ./* --clobber
              gh release edit "$TAG" --draft=false --verify-tag
            fi
            exit 0
          fi
          gh release create "$TAG" ./* --verify-tag --title "Voicebox DS ${TAG#ds-v}" --notes-file - <<'NOTES'
          - **macOS (Apple Silicon).** Download and unzip `Voicebox-DS-macOS-arm64.zip`. The app uses ad-hoc signing.
          - **Linux (x64).** Install `Voicebox-DS-Linux-x64.deb` on a Debian-based distribution.
          - **Windows (x64).** Run `Voicebox-DS-Windows-x64-setup.exe`. The installer includes the CPU backend.
          - **Optional NVIDIA acceleration on Windows.** Put `Install-CUDA.ps1`, `voicebox-server-cuda-windows-x86_64.tar.gz`, its `.sha256`, and `cuda-libs.json` in one folder. Quit Voicebox DS and run the script. If it requests the NVIDIA runtime archive, download it (or all of its numbered parts) into the same folder and rerun the script.
          NOTES
